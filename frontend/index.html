<style>
:root{--amber:#FFA21A;--amber-hi:#FFC53D;--amber-deep:#FF7A00;--ink:#191A23;--grad:linear-gradient(135deg,#FFD166 0%,#FFA21A 48%,#FF7A00 100%);
--glass:linear-gradient(135deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.07) 55%,rgba(255,255,255,.12) 100%),rgba(25,26,35,.34);
--glass-edge:rgba(255,255,255,.34);--glass-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 22px rgba(255,255,255,.05),0 18px 44px rgba(10,6,4,.38);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;min-height:100%;
background:radial-gradient(900px 520px at 88% 100%,rgba(255,197,61,.5),transparent 62%),radial-gradient(700px 420px at 6% 0%,rgba(255,122,0,.2),transparent 60%),linear-gradient(180deg,#191A23 0%,#231915 36%,#5a2a0c 66%,#b04f08 88%,#ee7d00 100%) fixed}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:transparent;color:#fff;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(340px 340px at 82% 16%,rgba(255,165,30,.55),transparent 70%),radial-gradient(420px 420px at 10% 52%,rgba(255,110,0,.42),transparent 70%),radial-gradient(300px 300px at 62% 80%,rgba(255,215,120,.38),transparent 70%),radial-gradient(260px 260px at 30% 8%,rgba(255,255,255,.12),transparent 70%)}
section{scroll-margin-top:96px}
.card{position:relative;color:#fff;border:1px solid var(--glass-edge);border-radius:28px;background:var(--glass);box-shadow:var(--glass-shadow);-webkit-backdrop-filter:blur(22px) saturate(165%);backdrop-filter:blur(22px) saturate(165%);padding:22px}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 32%);mix-blend-mode:soft-light;opacity:.8}
.card.grey{background:var(--glass)}
.card.dark{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),rgba(15,10,8,.58)}
.card.amber{color:var(--ink);background:linear-gradient(135deg,rgba(255,214,110,.88) 0%,rgba(255,162,26,.82) 50%,rgba(255,122,0,.8) 100%);border-color:rgba(255,255,255,.55)}
.card.amber .badge.s-Pending{color:var(--ink);background:rgba(255,255,255,.4)}
.inp{width:100%;color:#fff;border:1px solid rgba(255,255,255,.38);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.1);font:inherit;box-shadow:inset 0 2px 6px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .15s,border-color .15s;color-scheme:dark}
.inp::placeholder{color:rgba(255,255,255,.55)}
.inp:hover{background:rgba(255,255,255,.15)}
.inp:focus{background:rgba(255,255,255,.18);border-color:var(--amber-hi)}
.inp option{background:#2b1c14;color:#fff}
.inp::file-selector-button{margin-right:12px;border:1px solid rgba(255,255,255,.45);border-radius:8px;padding:4px 12px;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.inp:focus,.btn:focus-visible,.pill:focus-visible,.nl:focus-visible{outline:3px solid var(--amber-hi);outline-offset:2px}
.btn{border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:10px 18px;font-weight:600;background:rgba(15,10,8,.6);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;transition:transform .12s,filter .15s,box-shadow .15s}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.lime{background:var(--grad);color:var(--ink);border-color:rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 22px rgba(255,138,0,.45)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
.tag{background:var(--grad);border:1px solid rgba(255,255,255,.6);padding:2px 14px;border-radius:8px;font-weight:700;display:inline-block;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 16px rgba(255,138,0,.35)}
.pill{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 16px;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background .15s,transform .12s}
.pill:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
.pill.on{background:var(--grad);color:var(--ink);font-weight:700;border-color:rgba(255,255,255,.65)}
.badge{border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.s-Pending{background:rgba(255,255,255,.16);color:#fff}.s-Approved,.s-Verified{background:var(--grad);color:var(--ink)}.s-Rejected{background:rgba(15,10,8,.8);color:#fff}.s-Expired{background:rgba(255,217,168,.9);color:var(--ink)}
.frame{width:72px;height:72px;border:1px solid rgba(255,255,255,.55);border-radius:22px 22px 22px 6px;background:var(--grad);color:var(--ink);overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:24px;flex:none;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.frame img{width:100%;height:100%;object-fit:cover}
label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.tbl{overflow-x:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;color:#fff;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.03)),rgba(15,10,8,.55);border:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,162,26,.7);border-radius:0 0 22px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 34px rgba(255,138,0,.3);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
.logo{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:18px;background:var(--grad);color:var(--ink);font-size:28px;font-weight:700;border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 22px rgba(255,138,0,.45)}
.nl{color:#fff;background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:500;padding:6px 2px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.nl:hover{border-color:var(--amber)}.nl.on{color:var(--amber-hi);border-color:var(--amber-hi)}
.card.qa{cursor:pointer;transition:background .2s,transform .15s,box-shadow .15s,color .15s}
.card.qa:hover{background:linear-gradient(135deg,rgba(255,214,110,.9),rgba(255,122,0,.85));color:var(--ink);transform:translateY(-5px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 22px 44px rgba(255,138,0,.4)}
.card.qa:active{transform:translateY(1px)}
.shadowtxt{text-shadow:0 1px 2px rgba(25,26,35,.9),0 2px 14px rgba(25,26,35,.75)}
.item{border:1px solid rgba(255,255,255,.28);border-radius:18px;padding:14px 16px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s}
.item:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 14px 28px rgba(0,0,0,.3)}
.panel{background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.4)}
.empty{padding:16px;border:1px dashed rgba(255,255,255,.4);border-radius:16px;background:rgba(255,255,255,.07);font-size:14px}
.meter{height:14px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);box-shadow:inset 0 2px 5px rgba(0,0,0,.35);overflow:hidden}.meter>i{display:block;height:100%;background:var(--grad);box-shadow:0 0 14px rgba(255,162,26,.8);transition:width .4s}
#modal .card{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05)),rgba(20,13,10,.74);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
a{color:#FFD166}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid rgba(255,255,255,.35);text-align:center;font-size:11px;line-height:1.7;color:#fff;font-weight:500;text-shadow:0 1px 8px rgba(25,26,35,.8)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(15,10,8,.75);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--amber-hi);border:1px solid rgba(255,162,26,.7);padding:10px 20px;border-radius:14px;font-weight:700;z-index:60;display:none;max-width:90vw}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main>*{animation:rise .35s ease both}
@media(prefers-reduced-motion:reduce){main>*{animation:none}html{scroll-behavior:auto}.btn,.card.qa,.item,.pill{transition:none}}
@media(max-width:640px){.card{padding:18px;border-radius:22px}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,#modal .card{background:rgba(35,25,21,.92)}}

const facilities=()=>{

async function facultyBackendId(){const r=await fetch('http://localhost:5000/teachers');if(!r.ok)throw new Error('Could not load faculty list from backend.');const teachers=await r.json();const fid=String(S.user.fid||'').toUpperCase();let found=teachers.find(t=>String(t.initials||'').toUpperCase()===fid||String(t.id)===fid);if(!found){const c=await fetch('http://localhost:5000/teachers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:S.user.name,email:String(S.user.fid).toLowerCase()+'@example.edu',department:S.user.dept||'',initials:String(S.user.fid)})});if(!c.ok)throw new Error('Your faculty ID could not be matched to a backend faculty record.');found=await c.json()}return found.id}

else if(a==='dec'){const o=S.o.find(x=>x.id===d.id);o.status=d.s;o.remark=$('#r'+o.id).value.trim();save();render();toast(d.s==='Approved'?'Permission approved':'Permission rejected')}
else if(a==='pdec'){const o=S.o.find(x=>x.id===d.id),r=$('#pr'+d.id);o.pstatus=d.s;o.premark=r?r.value.trim():'';save();render();toast(d.s==='Accepted'?'Proof accepted':'Proof rejected')}
else if(a==='odtab'){S.odTab=d.t;S.pre='';render()}
else if(a==='goproof'){S.tab='od';S.odTab='sub';S.pre=d.id;render();window.scrollTo(0,0)}});

document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card.qa')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#grid').innerHTML=cards()}
if(e.target.id==='oid'){S.pre=e.target.value;render()}});
const read=f=>new Promise(r=>{if(!f||f.size>1500000)return r('');const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));
if(f.dataset.k){const k=f.dataset.k,p=S.f.find(x=>x.id===S.user.fid),err=f.querySelector('[data-err]'),c={},now=new Date().toISOString().slice(0,10);p[k]=p[k]||[];
Object.keys(v).forEach(n=>{if(typeof v[n]==='string')c[n]=v[n].trim()});
const bad=m=>{err.textContent=m};
if(k==='papers'&&(+c.year<1950||+c.year>new Date().getFullYear()+1))return bad('Enter a valid publication year.');
if(c.link&&!su(c.link))return bad('The link must start with http:// or https://.');
if(k==='certs'){if(c.issued>now)return bad('Issue date cannot be in the future.');if(c.expiry&&c.expiry<c.issued)return bad('Expiry date must be after the issue date.')}
const ed=S.ed&&S.ed.k===k?p[k].find(x=>x.id===S.ed.id):null;
if(k==='certs'){const fl=f.elements.file&&f.elements.file.files[0];if(fl&&fl.size>1500000)return bad('The scan is over 1.5 MB.');if(fl){c.file=fl.name;c.data=await read(fl)}
if(ed){Object.assign(ed,c,{status:'Pending',remark:'',verifiedOn:''})}else p[k].push({id:'c'+Date.now()+Math.floor(Math.random()*1e3),...c,status:'Pending',remark:'',verifiedOn:''})}
else if(ed)Object.assign(ed,c);else p[k].push({id:k[0]+Date.now()+Math.floor(Math.random()*1e3),...c});
S.ed=null;S.del=null;if(save()){render();toast(ed?'Changes saved':'Added to your profile')}return}
if(f.id==='lgf'){const u=v.u.trim().toLowerCase(),p=v.p,r=S.lr;let user=null;
if(r==='student'&&u==='student'&&p==='student123')user={role:r,name:'Demo Student',dept:v.dsel};
else if(r==='admin'&&u==='admin'&&p==='admin123')user={role:r,name:'Admin Office'};
else if(r==='faculty'){const dp=v.dsel,m=DF.find(x=>x.dept===dp&&uname(x)===u);if(m&&p===u+'123'){const fx=ensureF(m);user={role:r,fid:fx.id,name:fx.name,dept:dp}}else{const fx=S.f.find(x=>x.id===u&&x.dept===dp);if(fx&&p===u+'123')user={role:r,fid:fx.id,name:fx.name,dept:dp}}}
if(!user){S.lerr='Incorrect username or password for the '+r+' role.';$('#lerr').textContent=S.lerr;return}
S.dd=user.dept||'IT';S.user=user;saveSession();S.tab='home';S.lerr='';render();window.scrollTo(0,0);toast('Signed in as '+user.name);return}
if(f.id==='odf'){const m=S.f.find(x=>x.name===v.mentor);if(!m){$('#err').textContent='Pick a mentor from the list.';return}
if(v.to<=v.from){$('#err').textContent='“To” must be after “From”.';return}
S.o.unshift({id:'o'+Date.now(),student:v.student,roll:v.roll,dept:v.dept,ys:v.ys,mentor:m.id,cat:v.cat,event:v.event,venue:v.venue,from:v.from,to:v.to,proof:'',data:'',pstatus:'',premark:'',status:'Pending',remark:''});
if(save()){S.tab='track';render();toast('OD permission requested')}}
if(f.id==='ods'){const o=S.o.find(x=>x.id===v.oid&&x.student===S.user.name),err=$('#err'),file=f.proof.files[0];
if(!o){err.textContent='Pick the event you attended.';return}
if(!file){err.textContent='Attach your proof document.';return}
if(v.ato<=v.afrom){err.textContent='“Attended to” must be after “Attended from”.';return}
if(file.size>1500000){err.textContent='The file is over 1.5 MB. Choose a smaller PDF or image.';return}
const data=await read(file);if(!data){err.textContent='Could not read the file. Try again.';return}
Object.assign(o,{proof:file.name,data,ptype:v.ptype,pstatus:'Pending',premark:'',post:{afrom:v.afrom,ato:v.ato,mode:v.mode,result:v.result,position:(v.position||'').trim(),certrec:v.certrec,summary:v.summary.trim()}});
if(save()){S.tab='track';S.pre='';render();toast('OD details and proof submitted to your mentor');sendProofToOneDrive(o,file).then(u=>{o.odurl=u;save();toast('Proof saved to your mentor’s OneDrive',4000)}).catch(er=>toast('Submitted, but not uploaded to OneDrive: '+(er.message||er),7000))}}
if(f.id==='ef'){const p=S.f.find(x=>x.id===S.user.fid);['name','desig','dept','email','phone','cabin','research','qual'].forEach(k=>p[k]=v[k]);
const ph=await read(f.photo.files[0]);if(ph)p.photo=ph;S.user.name=p.name;S.user.dept=p.dept;saveSession();save();S.msg='Profile saved.';render()}});
try{const u=JSON.parse(localStorage.getItem('nexus_session')||'null');if(u&&u.role&&(u.role!=='faculty'||S.f.some(x=>x.id===u.fid))){S.user=u;S.dd=u.dept||'IT'}}catch(_){}
(()=>{const q=new URLSearchParams(location.search);if(!q.has('connected'))return;let r=null;try{r=JSON.parse(sessionStorage.getItem('nexus_resume')||'null');sessionStorage.removeItem('nexus_resume')}catch(_){}history.replaceState(null,'',location.pathname);if(r&&r.user){S.user=r.user;S.tab=r.tab||'approve';S.dd=r.user.dept||'IT'}const ok=q.get('connected')==='1';setTimeout(()=>toast(ok?'OneDrive connected':'OneDrive connection failed'+(q.get('error')?': '+q.get('error'):'')),400)})();
render();
</script>
</body>
</html>
